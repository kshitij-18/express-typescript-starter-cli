name: Publish Package Pipeline

on:
  push: 
    branches:
      - develop

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    - name: Run tests
      run: yarn test


  Publish: 
    runs-on: ubuntu-latest
    needs: [Test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    # Debug and fix Yarn v4 configuration
    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    - name: Run lint
      run: |
        echo "=== Debugging lint issues ==="
        echo "Current directory:"
        pwd
        echo "Files in current directory:"
        ls -la
        echo "Checking lint script in package.json:"
        cat package.json | grep -A 3 -B 1 '"lint'
        echo "Running lint with verbose output:"
        yarn lint:check --verbose || yarn lint:check --debug || true
        echo "=== Running actual lint ==="
        yarn lint:check

    - name: Run type check
      run: yarn type-check

    - name: Build project
      run: yarn build

    # Configure yarn for npm publishing
    - name: Configure Yarn for NPM publish
      run: |
        yarn config set npmRegistryServer "https://registry.npmjs.org"
        yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

    - name: Publish to NPM
      run: yarn npm publish --access public
      env: 
        NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}