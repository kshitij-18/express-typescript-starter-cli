name: Publish Package Pipeline

on:
  push: 
    branches:
      - develop

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable
    
    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    - name: Run tests
      run: yarn test
  
  Lint: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    - name: Run lint
      run: yarn lint:check
  
  Typecheck: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    - name: Run type check
      run: yarn type-check
  
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    - name: Build project
      run: yarn build
  
  
  Publish: 
    runs-on: ubuntu-latest
    needs: [Test, Lint, Typecheck, Build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.17'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    # Debug and fix Yarn v4 configuration
    - name: Configure Yarn for CI
      run: |
        echo "=== Current Yarn config ==="
        cat .yarnrc.yml || echo "No .yarnrc.yml found"
        echo "=== Setting CI-friendly config ==="
        yarn config set enableGlobalCache false
        yarn config set enableImmutableInstalls false
        echo "=== Updated config ==="
        cat .yarnrc.yml

    - name: Install dependencies
      run: yarn install

    # Configure yarn for npm publishing
    - name: Configure Yarn for NPM publish
      run: |
        yarn config set npmRegistryServer "https://registry.npmjs.org"
        yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

    - name: Publish to NPM
      run: yarn npm publish --access public
      env: 
        NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}